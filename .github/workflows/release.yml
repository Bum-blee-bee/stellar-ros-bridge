name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (use a pre-release tag for a test run)."
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and attest release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      - name: Build workspace binaries
        run: cargo build --release --locked --workspace

      - name: Build deployable escrow wasm
        env:
          SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2: "1"
        run: |
          cargo build --release --locked \
            --manifest-path contracts/task-escrow/Cargo.toml \
            --target wasm32v1-none

      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp contracts/task-escrow/target/wasm32v1-none/release/task_escrow.wasm dist/
          for binary in bridge-node stellar-testnet-smoke simulated-robot; do
            cp "target/release/${binary}" "dist/${binary}"
          done
          (
            cd dist
            sha256sum task_escrow.wasm bridge-node stellar-testnet-smoke simulated-robot \
              > SHA256SUMS
          )
          ls -l dist

      # Produces SLSA v1 provenance signed by GitHub's build platform. The
      # attestation is stored in the repository and bound to the digest of
      # every file in dist/.
      - name: Generate SLSA provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Stellar ROS Bridge ${RELEASE_TAG}" \
              --verify-tag \
              --generate-notes
          fi
