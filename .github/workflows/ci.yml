name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  RUSTUP_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Builds and tests the crates that do not require a ROS 2 installation.
  core:
    name: core (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Unit tests plus a deployable wasm build for the escrow contract.
  contracts:
    name: task-escrow (fmt, clippy, test, wasm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/task-escrow
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/task-escrow
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Build deployable wasm
        env:
          SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2: "1"
        run: cargo build --release --target wasm32v1-none

  # ROS-facing crates need a ROS 2 environment. This job is present so the
  # pipeline is ready for it, but is disabled until the rclrs transport lands.
  ros:
    name: ros (ROS 2 Jazzy)
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - uses: dtolnay/rust-toolchain@stable
      - name: Build ros-bridge
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cargo build -p ros-bridge --features ros
